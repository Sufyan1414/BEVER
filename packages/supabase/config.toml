# BEVER — Supabase CLI Configuration
project_id = "bever-hyperlocal-marketplace"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "2097152"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 6

[auth.rate_limit]
# Brake on scripted PIN guessing / mass signups (per IP, per 5 minutes)
sign_in_sign_ups = 30
token_refresh = 150
email_sent = 4

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
