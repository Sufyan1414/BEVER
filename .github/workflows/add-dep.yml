name: Add dependency (one-off)
on:
  push:
    branches: ['deps/**']
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Install expo-location at the SDK-compatible version
        working-directory: apps/rider
        run: npx expo install expo-location
      - name: Commit manifest and lockfile
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add apps/rider/package.json package-lock.json
          git diff --cached --stat
          git commit -m "chore: add expo-location to rider (SDK-compatible)" || echo "nothing to commit"
          git push
